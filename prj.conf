# Logging
CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=10240

# Optional: suppress Zephyr boot banner lines on console
CONFIG_BOOT_BANNER=n

# Disable ANSI color codes in log output
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# UART backend (VCOM0 via on-board debugger virtual COM)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y

CONFIG_TFM_LOG_LEVEL_SILENCE=y

# Disable RTT logging backend
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n

# BLE GATT (write/notify)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TJ3"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=n

# Simple advertising
CONFIG_BT_OBSERVER=n

# M90E26 sensor module (UART bring-up)
CONFIG_SENSOR=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_M90E26=y

# TJ3 communication modules
CONFIG_TJ3_COMM=y
CONFIG_TJ3_COMM_PROTOCOL=y
CONFIG_TJ3_COMM_NRF9151_LINK=y
CONFIG_TJ3_COMM_BLE=y

