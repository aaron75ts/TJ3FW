# 基礎串口與中斷支援
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# GPIO 支援
CONFIG_GPIO=y

# Console 設定 (Disable Standard Consoles to use Custom Protocol Log)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n

# 強制啟用 Log Output 模組 (因為停用了標準 Backend 但需要用 log_output API)
CONFIG_LOG_OUTPUT=y

# 啟用日誌系統 (非同步模式)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=2000
CONFIG_LOG_PRINTK=y
# 設為 DEBUG(4) 可輸出 atm90e26 RAW DATA
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_FILTERING=y

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# 啟用 Async UART (DMA)
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE=y

# 啟用 SPI FLASH & LITTLEFS 支援
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# 指定 LittleFS 放在外部 Flash (需要 pm.yml 中有定義對應的 region)
CONFIG_PM_PARTITION_REGION_LITTLEFS_EXTERNAL=y
# 配置 LittleFS partition size，需小於或等於 pm.yml 中定義的 region 大小 
CONFIG_PM_PARTITION_SIZE_LITTLEFS=0x00600000
CONFIG_FILE_SYSTEM_MKFS=y


# 啟用 BLE 支援
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TJ3-GW"

# BLE 廣播與連接參數配置 (提升桌面端掃描相容性)
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# 啟用 GAP 服務 (桌面端掃描常需要)
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y

# 啟用必要的 BLE 功能
CONFIG_BT_GATT_DYNAMIC_DB=y
# 提升 ATT MTU 以支援 >20 byte 的單次 Write Request
# meter_config_t = 24 bytes；預設 MTU payload 20 bytes 會觸發 Long Write，
# macOS CoreBluetooth Long Write 不穩定，提升 MTU 可直接繞開此問題
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Long Write 仍保留作為備用
CONFIG_BT_ATT_PREPARE_COUNT=4
# 禁用 SMP 以避免過於嚴格的安全設置阻礙掃描
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n

# 設定發射功率 (nRF54L15 支援範圍 -40 ~ +8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Controller 廣播配置
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=191

CONFIG_SENSOR=y
CONFIG_ATM90E26=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# 記憶體配置
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# 增加 idle stack 大小
CONFIG_IDLE_STACK_SIZE=2048
# 增加 ISR stack 大小
CONFIG_ISR_STACK_SIZE=2048

# 浮點數支援 (用於 snprintf %f 格式化)
CONFIG_CBPRINTF_FP_SUPPORT=y
# 啟用數學庫支援 (sinf, cosf 等函數) - 需要使用 newlib
CONFIG_NEWLIB_LIBC=y

# Debug 支援 (nRF Connect debugger 需要)
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
